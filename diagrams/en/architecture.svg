<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="architecture-title" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif">
<title id="architecture-title">Human inputs, custom supervision and native execution</title>
<defs><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#49636a"/></marker></defs>
<rect width="1000" height="1010" fill="#fcfdfb"/>
<text x="500" y="34" text-anchor="middle" font-size="23" fill="#16353d" font-weight="700">INPUT → SUPERVISION → EXECUTION → REVIEW</text>
<rect x="230" y="55" width="540" height="80" rx="12" fill="#fff2d9" stroke="#b88830" stroke-width="2"/>
<text x="500.0" y="84" text-anchor="middle" font-size="18" fill="#16353d" font-weight="700">Human requests and decisions</text>
<text x="500.0" y="110" text-anchor="middle" font-size="16" fill="#16353d">Owner authorization ≠ client intent</text>
<path d="M500 135 L140 180" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M500 135 L380 180" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M500 135 L620 180" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M500 135 L860 180" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<rect x="30" y="180" width="220" height="132" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="140.0" y="209" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">Slack daily entry</text>
<text x="140.0" y="235" text-anchor="middle" font-size="14" fill="#16353d">Owner member ID only</text>
<text x="140.0" y="261" text-anchor="middle" font-size="14" fill="#16353d">Control channel: two-way</text>
<text x="140.0" y="287" text-anchor="middle" font-size="14" fill="#16353d">Cards · ch. 19–20</text>
<rect x="270" y="180" width="220" height="132" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="380.0" y="209" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">Phone / chat bots</text>
<text x="380.0" y="235" text-anchor="middle" font-size="14" fill="#16353d">One shared platform account</text>
<text x="380.0" y="261" text-anchor="middle" font-size="14" fill="#16353d">Inbox + doorbell · ch. 17, 19</text>
<text x="380.0" y="287" text-anchor="middle" font-size="14" fill="#16353d">Orders: data until confirmed</text>
<rect x="510" y="180" width="220" height="132" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="620.0" y="209" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">Owner Discord intake</text>
<text x="620.0" y="235" text-anchor="middle" font-size="14" fill="#16353d">Owner only · no mention</text>
<text x="620.0" y="261" text-anchor="middle" font-size="14" fill="#16353d">Fixed project · bounded Q&amp;A</text>
<text x="620.0" y="287" text-anchor="middle" font-size="14" fill="#16353d">Default profile · custom</text>
<rect x="750" y="180" width="220" height="132" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="860.0" y="209" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">Client LINE gateway</text>
<text x="860.0" y="235" text-anchor="middle" font-size="14" fill="#16353d">Signed identity · registry</text>
<text x="860.0" y="261" text-anchor="middle" font-size="14" fill="#16353d">Client intent ≠ approval</text>
<text x="860.0" y="287" text-anchor="middle" font-size="14" fill="#16353d">Separate profile · custom</text>
<path d="M140 312 L140 347" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M140 347 L500 385" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M380 312 L380 347" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M380 347 L500 385" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M620 312 L620 347" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M620 347 L500 385" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M860 312 L860 347" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M860 347 L500 385" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<rect x="135" y="385" width="730" height="106" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="500.0" y="414" text-anchor="middle" font-size="18" fill="#16353d" font-weight="700">Custom supervisor routing + private ledger</text>
<text x="500.0" y="440" text-anchor="middle" font-size="16" fill="#16353d">Fixed bindings · separate native / ledger project IDs</text>
<text x="500.0" y="466" text-anchor="middle" font-size="16" fill="#16353d">Coordinator A/B by domain · preserve holds · no intake writer launch</text>
<path d="M500 491 L500 530" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<rect x="135" y="530" width="730" height="80" rx="12" fill="#eaf0fb" stroke="#426bb0" stroke-width="2"/>
<text x="500.0" y="559" text-anchor="middle" font-size="18" fill="#16353d" font-weight="700">Orca-native mailbox → coordinator reads and accepts</text>
<text x="500.0" y="585" text-anchor="middle" font-size="16" fill="#16353d">Durable enqueue is not read, acceptance or execution</text>
<path d="M500 610 L500 650" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<rect x="135" y="650" width="730" height="106" rx="12" fill="#eaf0fb" stroke="#426bb0" stroke-width="2"/>
<text x="500.0" y="679" text-anchor="middle" font-size="18" fill="#16353d" font-weight="700">Supervisor selects one healthy, appropriate writer</text>
<text x="500.0" y="705" text-anchor="middle" font-size="16" fill="#16353d">Native resident Run → Task (work) → Dispatch (attempt)</text>
<text x="500.0" y="731" text-anchor="middle" font-size="16" fill="#16353d">Scoped execution · project member owner · canonical project files</text>
<path d="M500 756 L500 795" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<rect x="135" y="795" width="730" height="80" rx="12" fill="#f2eafb" stroke="#82649c" stroke-width="2"/>
<text x="500.0" y="824" text-anchor="middle" font-size="18" fill="#16353d" font-weight="700">Independent fixed-version review → actual user acceptance</text>
<text x="500.0" y="850" text-anchor="middle" font-size="16" fill="#16353d">Corrections return to the same writer; new version needs review</text>
<path d="M500 875 L500 910" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<rect x="135" y="910" width="730" height="70" rx="12" fill="#fff2d9" stroke="#b88830" stroke-width="2"/>
<text x="500.0" y="939" text-anchor="middle" font-size="18" fill="#16353d" font-weight="700">External action: scoped authorization + authorized executor</text>
<text x="500.0" y="965" text-anchor="middle" font-size="16" fill="#16353d">Green: custom pattern · Blue: native layer · Not a shipped runtime</text>
</svg>
