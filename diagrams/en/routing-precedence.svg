<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Routing precedence: first match wins" font-family="Arial, Helvetica, sans-serif">
<title>Routing precedence: first match wins</title>
<defs><marker id="ah-routing-precedence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495e" /></marker></defs>
<rect x="0" y="0" width="760" height="300" fill="#ffffff" />
<rect x="20" y="40" width="165" height="70" rx="10" fill="#eef2f7" stroke="#5d6d7e" stroke-width="2" />
<text x="102.5" y="69.9" text-anchor="middle" font-size="14.0" fill="#1b2631" font-weight="700">1 Task override</text>
<text x="102.5" y="89.9" text-anchor="middle" font-size="12.0" fill="#1b2631">task_overrides</text>
<line x1="185" y1="75" x2="205" y2="75" stroke="#34495e" stroke-width="1.8" marker-end="url(#ah-routing-precedence)" />
