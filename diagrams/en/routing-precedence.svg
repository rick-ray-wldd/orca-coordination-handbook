<text x="657.5" y="89.9" text-anchor="middle" font-size="12.0" fill="#1b2631">default_domain</text>
<text x="380" y="26" font-size="12.0" text-anchor="middle" fill="#34495e">Continue only if no match</text>
<rect x="150" y="160" width="460" height="60" rx="10" fill="#dbe8ff" stroke="#2f5fb3" stroke-width="2" />
<text x="380.0" y="184.9" text-anchor="middle" font-size="14.0" fill="#1b2631" font-weight="700">Domain → primary supervisor + independent reviewer</text>
<text x="380.0" y="204.9" text-anchor="middle" font-size="12.0" fill="#1b2631">Primary unavailable → reviewer acts as supervisor</text>
<line x1="380" y1="110" x2="380" y2="160" stroke="#34495e" stroke-width="1.8" marker-end="url(#ah-routing-precedence)" />
<text x="380" y="252" font-size="12.0" text-anchor="middle" fill="#34495e">Routing changes supervision and input ownership, not the writer or task owner</text>
<text x="380" y="276" font-size="12.0" text-anchor="middle" fill="#34495e">Updates: lock / backup / version / changelog / validation</text>
