<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="Five dispatch decisions" font-family="Arial, Helvetica, sans-serif">
<title>Five dispatch decisions</title>
<defs><marker id="ah-dispatch-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495e" /></marker></defs>
<rect x="0" y="0" width="760" height="600" fill="#ffffff" />
<rect x="280" y="12" width="200" height="46" rx="10" fill="#fdebd0" stroke="#b9770e" stroke-width="2" />
<text x="380.0" y="39.9" text-anchor="middle" font-size="14.0" fill="#1b2631" font-weight="700">User request</text>
<polygon points="380,72.0 530.0,110 380,148.0 230.0,110" fill="#fffbe6" stroke="#b7950b" stroke-width="2" />
<text x="380" y="106" text-anchor="middle" font-size="13.0" fill="#1b2631">Quick read-only</text>
<text x="380" y="124" text-anchor="middle" font-size="13.0" fill="#1b2631">question?</text>
