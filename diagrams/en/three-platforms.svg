<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="three-platforms-title" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif">
<title id="three-platforms-title">Three platforms around one local record</title>
<defs><marker id="three-platforms-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#49636a"/></marker></defs>
<rect width="1000" height="900" fill="#fcfdfb"/>
<text x="500" y="36" text-anchor="middle" font-size="22" fill="#16353d" font-weight="700">THREE PLATFORMS · ONE LOCAL RECORD</text>
<rect x="130" y="56" width="740" height="80" rx="12" fill="#fff2d9" stroke="#b88830" stroke-width="2"/>
<text x="500.0" y="85" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">Owner: the only level A source</text>
<text x="500.0" y="111" text-anchor="middle" font-size="15" fill="#16353d">Phone call · typing in Slack or the bot chat · Orca · card buttons</text>
<path d="M500 136 L170 176" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#three-platforms-arrow)"/>
<rect x="30" y="176" width="280" height="200" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="170.0" y="205" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">Phone / chat bots</text>
<text x="170.0" y="231" text-anchor="middle" font-size="15" fill="#16353d">Main bot → project bots</text>
<text x="170.0" y="255" text-anchor="middle" font-size="15" fill="#16353d">Account managers per project</text>
<text x="170.0" y="279" text-anchor="middle" font-size="15" fill="#16353d">Work-order inbox + doorbell</text>
<text x="170.0" y="303" text-anchor="middle" font-size="15" fill="#16353d">Orders: data until owner confirms</text>
<text x="170.0" y="327" text-anchor="middle" font-size="15" fill="#16353d">Overnight quiet hours</text>
<path d="M170 376 L170 446" stroke="#49636a" stroke-width="2" fill="none" marker-start="url(#three-platforms-arrow)" marker-end="url(#three-platforms-arrow)"/>
<path d="M500 136 L500 176" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#three-platforms-arrow)"/>
<rect x="360" y="176" width="280" height="200" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="500.0" y="205" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">Slack: daily entry</text>
<text x="500.0" y="231" text-anchor="middle" font-size="15" fill="#16353d">Today · Decisions · Control</text>
<text x="500.0" y="255" text-anchor="middle" font-size="15" fill="#16353d">One channel per project</text>
<text x="500.0" y="279" text-anchor="middle" font-size="15" fill="#16353d">Control channel: two-way sync</text>
<text x="500.0" y="303" text-anchor="middle" font-size="15" fill="#16353d">Masks credentials, ID, card no.</text>
<text x="500.0" y="327" text-anchor="middle" font-size="15" fill="#16353d">An interface, not the record</text>
<path d="M500 376 L500 446" stroke="#49636a" stroke-width="2" fill="none" marker-start="url(#three-platforms-arrow)" marker-end="url(#three-platforms-arrow)"/>
<path d="M500 136 L830 176" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#three-platforms-arrow)"/>
<rect x="690" y="176" width="280" height="200" rx="12" fill="#eaf0fb" stroke="#426bb0" stroke-width="2"/>
<text x="830.0" y="205" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">Orca: deep work</text>
<text x="830.0" y="231" text-anchor="middle" font-size="15" fill="#16353d">Coordinators supervise only</text>
<text x="830.0" y="255" text-anchor="middle" font-size="15" fill="#16353d">One CTO per project (cap, 48 h)</text>
<text x="830.0" y="279" text-anchor="middle" font-size="15" fill="#16353d">Writers · reviewers · evidence</text>
<text x="830.0" y="303" text-anchor="middle" font-size="15" fill="#16353d">Follow-ups into writer terminal</text>
<text x="830.0" y="327" text-anchor="middle" font-size="15" fill="#16353d">Workspace board = progress</text>
<path d="M830 376 L830 446" stroke="#49636a" stroke-width="2" fill="none" marker-start="url(#three-platforms-arrow)" marker-end="url(#three-platforms-arrow)"/>
<path d="M642 226 L688 226" stroke="#49636a" stroke-width="2" fill="none" marker-start="url(#three-platforms-arrow)" marker-end="url(#three-platforms-arrow)"/>
<rect x="60" y="446" width="880" height="106" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="500.0" y="475" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">Host computer: the record</text>
<text x="500.0" y="501" text-anchor="middle" font-size="15" fill="#16353d">Shared state file (filtered, data only) · decision ledger (append-only)</text>
<text x="500.0" y="525" text-anchor="middle" font-size="15" fill="#16353d">Dispatch log · routing table · grant table · station reports</text>
<path d="M275 552 L275 602" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#three-platforms-arrow)"/>
<path d="M725 552 L725 602" stroke="#49636a" stroke-width="2" fill="none" marker-start="url(#three-platforms-arrow)" marker-end="url(#three-platforms-arrow)"/>
<rect x="60" y="602" width="430" height="106" rx="12" fill="#f2eafb" stroke="#82649c" stroke-width="2"/>
<text x="275.0" y="631" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">Daily inspection ×3, read-only</text>
<text x="275.0" y="657" text-anchor="middle" font-size="15" fill="#16353d">Summary model has no tools</text>
<text x="275.0" y="681" text-anchor="middle" font-size="15" fill="#16353d">→ notification channel + board</text>
<rect x="510" y="602" width="430" height="106" rx="12" fill="#f2eafb" stroke="#82649c" stroke-width="2"/>
<text x="725.0" y="631" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">Cloud drive: one path rule</text>
<text x="725.0" y="657" text-anchor="middle" font-size="15" fill="#16353d">&lt;root&gt;/&lt;group&gt;/&lt;project&gt;/&lt;type&gt;/&lt;file&gt;</text>
<text x="725.0" y="681" text-anchor="middle" font-size="15" fill="#16353d">Secrets never · sensitive encrypted</text>
<rect x="130" y="750" width="740" height="80" rx="12" fill="#fff2d9" stroke="#b88830" stroke-width="2"/>
<text x="500.0" y="779" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">External effect → decision card</text>
<text x="500.0" y="805" text-anchor="middle" font-size="15" fill="#16353d">Payments, passwords, accounts, logins: the owner personally</text>
<text x="500" y="870" text-anchor="middle" font-size="13" fill="#16353d">Yellow: owner · Green: custom pattern · Blue: native Orca layer · Not a shipped runtime</text>
</svg>
