<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="各層綁定：project、workspace、terminal、session、station、report、task、Run、Dispatch" font-family="'PingFang TC','Heiti TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
<title>各層綁定：project、workspace、terminal、session、station、report、task、Run、Dispatch</title>
<defs><marker id="ah-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495e"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<rect x="280" y="14" width="200" height="52" rx="10" fill="#eef2f7" stroke="#5d6d7e" stroke-width="2"/>
<text x="380.0" y="34.9" text-anchor="middle" font-size="14" fill="#1b2631" font-weight="700">project</text>
<text x="380.0" y="54.9" text-anchor="middle" font-size="12" fill="#1b2631">產品／主題</text>
<rect x="60" y="110" width="230" height="56" rx="10" fill="#e8f6f3" stroke="#117a65" stroke-width="2"/>
<text x="175.0" y="132.9" text-anchor="middle" font-size="14" fill="#1b2631" font-weight="700">workspace</text>
<text x="175.0" y="152.9" text-anchor="middle" font-size="12" fill="#1b2631">worktree 或 folder・一張看板卡</text>
<rect x="470" y="110" width="230" height="56" rx="10" fill="#fef9e7" stroke="#9a7d0a" stroke-width="2"/>
<text x="585.0" y="132.9" text-anchor="middle" font-size="14" fill="#1b2631" font-weight="700">task（助理任務）</text>
<text x="585.0" y="152.9" text-anchor="middle" font-size="12" fill="#1b2631">若填 owner，須為同專案站台</text>
<line x1="330" y1="66" x2="190" y2="110" stroke="#34495e" stroke-width="1.8" marker-end="url(#ah-layers)"/>
<text x="200" y="92" font-size="12" fill="#34495e">1 對多</text>
<line x1="430" y1="66" x2="570" y2="110" stroke="#34495e" stroke-width="1.8" marker-end="url(#ah-layers)"/>
<text x="510" y="92" font-size="12" fill="#34495e">1 對多</text>
<rect x="20" y="220" width="160" height="56" rx="10" fill="#e8f6f3" stroke="#117a65" stroke-width="2"/>
<text x="100.0" y="243.1" text-anchor="middle" font-size="13" fill="#1b2631" font-weight="700">terminal</text>
<text x="100.0" y="262.1" text-anchor="middle" font-size="11" fill="#1b2631">handle 只在執行期有效</text>
<rect x="200" y="220" width="160" height="62" rx="10" fill="#ffffff" stroke="#5d6d7e" stroke-width="2"/>
<text x="280.0" y="236.6" text-anchor="middle" font-size="13" fill="#1b2631" font-weight="700">session</text>
<text x="280.0" y="255.6" text-anchor="middle" font-size="11" fill="#1b2631">代理 CLI 的 UUID</text>
<text x="280.0" y="274.6" text-anchor="middle" font-size="11" fill="#1b2631">同時只能一個 writer</text>
<line x1="140" y1="166" x2="100" y2="220" stroke="#34495e" stroke-width="1.8" marker-end="url(#ah-layers)"/>
<line x1="200" y1="166" x2="270" y2="220" stroke="#34495e" stroke-width="1.8" marker-end="url(#ah-layers)"/>
<rect x="110" y="320" width="200" height="56" rx="10" fill="#fef9e7" stroke="#9a7d0a" stroke-width="2"/>
<text x="210.0" y="343.1" text-anchor="middle" font-size="13" fill="#1b2631" font-weight="700">station（站台）</text>
<text x="210.0" y="362.1" text-anchor="middle" font-size="11" fill="#1b2631">＝ workspace＋代理＋session</text>
<line x1="270" y1="282" x2="230" y2="320" stroke="#34495e" stroke-width="1.8" marker-end="url(#ah-layers)"/>
<line x1="100" y1="276" x2="170" y2="320" stroke="#34495e" stroke-width="1.8" marker-end="url(#ah-layers)"/>
<rect x="110" y="400" width="200" height="52" rx="10" fill="#fef9e7" stroke="#9a7d0a" stroke-width="2"/>
<text x="210.0" y="421.1" text-anchor="middle" font-size="13" fill="#1b2631" font-weight="700">report（站台回報）</text>
<text x="210.0" y="440.1" text-anchor="middle" font-size="11" fill="#1b2631">每站一列・只寫自己</text>
<line x1="210" y1="376" x2="210" y2="400" stroke="#34495e" stroke-width="1.8" marker-end="url(#ah-layers)"/>
<line x1="470" y1="150" x2="310" y2="340" stroke="#34495e" stroke-width="1.8" marker-end="url(#ah-layers)"/>
<text x="352" y="306" font-size="12" fill="#34495e">owner</text>
<rect x="420" y="230" width="140" height="52" rx="10" fill="#e8f6f3" stroke="#117a65" stroke-width="2"/>
<text x="490.0" y="251.1" text-anchor="middle" font-size="13" fill="#1b2631" font-weight="700">Run</text>
<text x="490.0" y="270.1" text-anchor="middle" font-size="11" fill="#1b2631">原生命名空間＋收件匣</text>
<rect x="580" y="230" width="160" height="52" rx="10" fill="#e8f6f3" stroke="#117a65" stroke-width="2"/>
<text x="660.0" y="251.1" text-anchor="middle" font-size="13" fill="#1b2631" font-weight="700">orchestration Task</text>
<text x="660.0" y="270.1" text-anchor="middle" font-size="11" fill="#1b2631">原生工作物件</text>
<rect x="580" y="320" width="160" height="56" rx="10" fill="#e8f6f3" stroke="#117a65" stroke-width="2"/>
<text x="660.0" y="343.1" text-anchor="middle" font-size="13" fill="#1b2631" font-weight="700">Dispatch</text>
<text x="660.0" y="362.1" text-anchor="middle" font-size="11" fill="#1b2631">Task 的一次權威嘗試</text>
<line x1="560" y1="256" x2="580" y2="256" stroke="#34495e" stroke-width="1.8" marker-end="url(#ah-layers)"/>
<line x1="660" y1="282" x2="660" y2="320" stroke="#34495e" stroke-width="1.8" marker-end="url(#ah-layers)"/>
<rect x="420" y="400" width="320" height="52" rx="10" fill="#ffffff" stroke="#5d6d7e" stroke-width="2"/>
<text x="580.0" y="421.1" text-anchor="middle" font-size="13" fill="#1b2631" font-weight="700">receipts 資料夾／send receipt</text>
<text x="580.0" y="440.1" text-anchor="middle" font-size="11" fill="#1b2631">證據存放（規約）／送出回執（原生）</text>
<text x="560" y="216" font-size="12" text-anchor="middle" fill="#117a65" font-weight="700">原生 orchestration（可選）</text>
</svg>
