<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="architecture-title" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif">
<title id="architecture-title">人類入口、自製督導與原生執行</title>
<defs><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#49636a"/></marker></defs>
<rect width="1000" height="1010" fill="#fcfdfb"/>
<text x="500" y="34" text-anchor="middle" font-size="23" fill="#16353d" font-weight="700">入口 → 督導 → 執行 → 審查</text>
<rect x="230" y="55" width="540" height="80" rx="12" fill="#fff2d9" stroke="#b88830" stroke-width="2"/>
<text x="500.0" y="84" text-anchor="middle" font-size="18" fill="#16353d" font-weight="700">人類需求與決策</text>
<text x="500.0" y="110" text-anchor="middle" font-size="16" fill="#16353d">擁有者授權 ≠ 客戶意圖</text>
<path d="M500 135 L140 180" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M500 135 L380 180" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M500 135 L620 180" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M500 135 L860 180" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<rect x="30" y="180" width="220" height="132" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="140.0" y="209" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">Slack 每日入口</text>
<text x="140.0" y="235" text-anchor="middle" font-size="14" fill="#16353d">只認擁有者的成員 ID</text>
<text x="140.0" y="261" text-anchor="middle" font-size="14" fill="#16353d">總控頻道雙向同步</text>
<text x="140.0" y="287" text-anchor="middle" font-size="14" fill="#16353d">決策卡・第 19–20 章</text>
<rect x="270" y="180" width="220" height="132" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="380.0" y="209" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">電話／聊天 bot</text>
<text x="380.0" y="235" text-anchor="middle" font-size="14" fill="#16353d">共用一個平台帳號</text>
<text x="380.0" y="261" text-anchor="middle" font-size="14" fill="#16353d">收件匣＋門鈴・第 17、19 章</text>
<text x="380.0" y="287" text-anchor="middle" font-size="14" fill="#16353d">本人確認前工單是資料</text>
<rect x="510" y="180" width="220" height="132" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="620.0" y="209" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">個人／課程 Discord</text>
<text x="620.0" y="235" text-anchor="middle" font-size="14" fill="#16353d">僅擁有者・不必 mention</text>
<text x="620.0" y="261" text-anchor="middle" font-size="14" fill="#16353d">固定專案・有界問答</text>
<text x="620.0" y="287" text-anchor="middle" font-size="14" fill="#16353d">預設 profile・自製</text>
<rect x="750" y="180" width="220" height="132" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="860.0" y="209" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">客戶 LINE 入口</text>
<text x="860.0" y="235" text-anchor="middle" font-size="14" fill="#16353d">簽章身份・客戶 registry</text>
<text x="860.0" y="261" text-anchor="middle" font-size="14" fill="#16353d">客戶意圖 ≠ 授權</text>
<text x="860.0" y="287" text-anchor="middle" font-size="14" fill="#16353d">獨立 profile・自製</text>
<path d="M140 312 L140 347" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M140 347 L500 385" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M380 312 L380 347" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M380 347 L500 385" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M620 312 L620 347" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M620 347 L500 385" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M860 312 L860 347" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<path d="M860 347 L500 385" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<rect x="135" y="385" width="730" height="106" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="500.0" y="414" text-anchor="middle" font-size="18" fill="#16353d" font-weight="700">自製督導路由＋私人帳本</text>
<text x="500.0" y="440" text-anchor="middle" font-size="16" fill="#16353d">固定綁定・原生／帳本專案 ID 分開</text>
<text x="500.0" y="466" text-anchor="middle" font-size="16" fill="#16353d">依領域選總控 A/B・保留暫停・入口不啟動 writer</text>
<path d="M500 491 L500 530" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<rect x="135" y="530" width="730" height="80" rx="12" fill="#eaf0fb" stroke="#426bb0" stroke-width="2"/>
<text x="500.0" y="559" text-anchor="middle" font-size="18" fill="#16353d" font-weight="700">Orca 原生 mailbox → 總控讀取與接單</text>
<text x="500.0" y="585" text-anchor="middle" font-size="16" fill="#16353d">持久入列不等於已讀、接單或執行</text>
<path d="M500 610 L500 650" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<rect x="135" y="650" width="730" height="106" rx="12" fill="#eaf0fb" stroke="#426bb0" stroke-width="2"/>
<text x="500.0" y="679" text-anchor="middle" font-size="18" fill="#16353d" font-weight="700">督導選擇健康且適任的單一 writer</text>
<text x="500.0" y="705" text-anchor="middle" font-size="16" fill="#16353d">原生長駐 Run → Task（工作）→ Dispatch（嘗試）</text>
<text x="500.0" y="731" text-anchor="middle" font-size="16" fill="#16353d">限定範圍執行・owner 屬於專案・專案正本檔案</text>
<path d="M500 756 L500 795" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<rect x="135" y="795" width="730" height="80" rx="12" fill="#f2eafb" stroke="#82649c" stroke-width="2"/>
<text x="500.0" y="824" text-anchor="middle" font-size="18" fill="#16353d" font-weight="700">獨立固定版本審查 → 真正的 User 驗收</text>
<text x="500.0" y="850" text-anchor="middle" font-size="16" fill="#16353d">修正交回同一 writer；新版本須審查</text>
<path d="M500 875 L500 910" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/>
<rect x="135" y="910" width="730" height="70" rx="12" fill="#fff2d9" stroke="#b88830" stroke-width="2"/>
<text x="500.0" y="939" text-anchor="middle" font-size="18" fill="#16353d" font-weight="700">對外行動：限定範圍授權＋有權執行者</text>
<text x="500.0" y="965" text-anchor="middle" font-size="16" fill="#16353d">綠：自製模式・藍：原生層・不隨附執行環境</text>
</svg>
