<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="decision-card-title" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif">
<title id="decision-card-title">決策卡生命週期：一位負責人、一個版本、只用一次</title>
<defs><marker id="decision-card-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#49636a"/></marker></defs>
<rect width="1000" height="840" fill="#fcfdfb"/>
<text x="500" y="36" text-anchor="middle" font-size="22" fill="#16353d" font-weight="700">決策卡：一位負責人 · 一個版本 · 只用一次</text>
<rect x="300" y="56" width="400" height="96" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="500.0" y="85" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">由唯一負責人開卡</text>
<text x="500.0" y="111" text-anchor="middle" font-size="15" fill="#16353d">風險等級 · 內容雜湊 · 24 小時到期</text>
<text x="500.0" y="135" text-anchor="middle" font-size="15" fill="#16353d">拒絕：機密、付款、建帳號</text>
<path d="M500 152 L500 202" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#decision-card-arrow)"/>
<rect x="300" y="202" width="400" height="96" rx="12" fill="#fff2d9" stroke="#b88830" stroke-width="2"/>
<text x="500.0" y="231" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">擁有者在「決策」頻道按卡</text>
<text x="500.0" y="257" text-anchor="middle" font-size="15" fill="#16353d">A／B／C 按鈕，或表單：</text>
<text x="500.0" y="281" text-anchor="middle" font-size="15" fill="#16353d">「送出這一版」｜「照我寫的修改」</text>
<rect x="30" y="350" width="240" height="104" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="150.0" y="379" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">修改</text>
<text x="150.0" y="405" text-anchor="middle" font-size="15" fill="#16353d">新版本＋差異</text>
<text x="150.0" y="429" text-anchor="middle" font-size="15" fill="#16353d">舊版本失效</text>
<path d="M300 270 L190 350" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#decision-card-arrow)"/>
<text x="222" y="300" text-anchor="middle" font-size="14" fill="#16353d">修改</text>
<path d="M80 350 L80 104 L300 104" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#decision-card-arrow)"/>
<text x="190" y="94" text-anchor="middle" font-size="14" fill="#16353d">再確認一次</text>
<rect x="300" y="350" width="400" height="120" rx="12" fill="#edf5f0" stroke="#46836d" stroke-width="2"/>
<text x="500.0" y="379" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">記錄決定</text>
<text x="500.0" y="405" text-anchor="middle" font-size="15" fill="#16353d">只增不改的本機帳本</text>
<text x="500.0" y="429" text-anchor="middle" font-size="15" fill="#16353d">只寄給該卡負責人</text>
<text x="500.0" y="453" text-anchor="middle" font-size="15" fill="#16353d">這封信不執行任何事</text>
<path d="M500 298 L500 350" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#decision-card-arrow)"/>
<text x="560" y="330" text-anchor="start" font-size="14" fill="#16353d">送出／選擇</text>
<path d="M500 470 L500 520" stroke="#49636a" stroke-width="2" fill="none" marker-end="url(#decision-card-arrow)"/>
<rect x="300" y="520" width="400" height="120" rx="12" fill="#eaf0fb" stroke="#426bb0" stroke-width="2"/>
<text x="500.0" y="549" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">批准只用一次</text>
<text x="500.0" y="575" text-anchor="middle" font-size="15" fill="#16353d">動手前一刻：</text>
<text x="500.0" y="599" text-anchor="middle" font-size="15" fill="#16353d">核對案件＋雜湊＋負責人</text>
<text x="500.0" y="623" text-anchor="middle" font-size="15" fill="#16353d">已撤回、過期、用過 → 停</text>
<rect x="730" y="202" width="240" height="120" rx="12" fill="#f4f6f5" stroke="#8a9a9d" stroke-width="2" stroke-dasharray="7 5"/>
<text x="850.0" y="231" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">撤回</text>
<text x="850.0" y="257" text-anchor="middle" font-size="15" fill="#16353d">被取代：負責人撤回</text>
<text x="850.0" y="281" text-anchor="middle" font-size="15" fill="#16353d">不再提醒</text>
<text x="850.0" y="305" text-anchor="middle" font-size="15" fill="#16353d">不能再按</text>
<path d="M700 230 L730 230" stroke="#49636a" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#decision-card-arrow)"/>
<rect x="730" y="400" width="240" height="120" rx="12" fill="#fff2d9" stroke="#b88830" stroke-width="2" stroke-dasharray="7 5"/>
<text x="850.0" y="429" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">超過 24 小時</text>
<text x="850.0" y="455" text-anchor="middle" font-size="15" fill="#16353d">在「今日」提醒一次</text>
<text x="850.0" y="479" text-anchor="middle" font-size="15" fill="#16353d">@擁有者</text>
<text x="850.0" y="503" text-anchor="middle" font-size="15" fill="#16353d">一鍵連回原卡</text>
<path d="M700 280 L850 400" stroke="#49636a" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#decision-card-arrow)"/>
<rect x="130" y="690" width="740" height="80" rx="12" fill="#f2eafb" stroke="#82649c" stroke-width="2"/>
<text x="500.0" y="719" text-anchor="middle" font-size="17" fill="#16353d" font-weight="700">常設授權：每次動作不另開卡</text>
<text x="500.0" y="745" text-anchor="middle" font-size="15" fill="#16353d">每次使用都核對：範圍 · 每日上限 · 到期 · 是否關閉</text>
<text x="500" y="815" text-anchor="middle" font-size="13" fill="#16353d">虛線＝旁支 · 欄位名稱依參考設計 · 不是隨附的執行環境</text>
</svg>
